name: Render YouTube music video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Extrair capa e áudio
        run: |
          mkdir -p build dist

          ffmpeg -y -v error \
            -i "OS ATUAIS -05- Meu segredo (RITMO JOVEM) (1).mp4" \
            -vf "crop=660:660:311:30,scale=1000:1000:flags=lanczos" \
            -frames:v 1 \
            build/cover.png

          ffmpeg -y -v error \
            -i "OS ATUAIS -05- Meu segredo (RITMO JOVEM) (1).mp4" \
            -vn -ac 2 -ar 48000 \
            build/song.m4a

      - name: Criar introdução
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf

          ffmpeg -y -v error \
            -loop 1 -i build/cover.png \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -t 18 \
            -filter_complex "[0:v]scale=700:700[art];color=c=0x111111:s=1920x1080:d=18[bg];[bg][art]overlay=110:190,drawtext=fontfile=${FONT}:text='OS ATUAIS':fontcolor=white:fontsize=104:x=930:y=310,drawtext=fontfile=${FONT}:text='MEU SEGREDO':fontcolor=0xFFC125:fontsize=68:x=930:y=445,drawtext=fontfile=${FONT}:text='EU VOLTEI · VOLUME 9':fontcolor=white:fontsize=38:x=930:y=545,drawtext=fontfile=${FONT}:text='OS REIS DO BAILE':fontcolor=white@0.8:fontsize=30:x=930:y=650,format=yuv420p[v]" \
            -map "[v]" -map 1:a \
            -r 30 -c:v libx264 -preset veryfast -crf 21 \
            -c:a aac -b:a 160k \
            build/intro.mp4

      - name: Criar vídeo da música
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf

          ffmpeg -y -v error \
            -i "OS ATUAIS -05- Meu segredo (RITMO JOVEM) (1).mp4" \
            -filter_complex "[0:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black,drawbox=x=0:y=940:w=1920:h=140:color=black@0.72:t=fill,drawtext=fontfile=${FONT}:text='OS ATUAIS  ·  MEU SEGREDO':fontcolor=white:fontsize=45:x=70:y=968,drawtext=fontfile=${FONT}:text='EU VOLTEI · VOLUME 9':fontcolor=0xFFC125:fontsize=32:x=70:y=1028,format=yuv420p[v]" \
            -map "[v]" -map 0:a \
            -r 30 -c:v libx264 -preset veryfast -crf 21 \
            -c:a aac -b:a 192k -ar 48000 \
            build/music.mp4

      - name: Criar encerramento
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf

          ffmpeg -y -v error \
            -loop 1 -i build/cover.png \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -t 18 \
            -filter_complex "[0:v]scale=1920:1920,crop=1920:1080:0:350,eq=brightness=-0.55,drawbox=x=0:y=0:w=1920:h=1080:color=black@0.20:t=fill,drawtext=fontfile=${FONT}:text='QUAL LEMBRANÇA ESSA MÚSICA DESPERTA?':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=370,drawtext=fontfile=${FONT}:text='DEIXE SEU COMENTÁRIO':fontcolor=0xFFC125:fontsize=54:x=(w-text_w)/2:y=505,drawtext=fontfile=${FONT}:text='INSCREVA-SE PARA MAIS HISTÓRIAS DA MÚSICA':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=650,format=yuv420p[v]" \
            -map "[v]" -map 1:a \
            -r 30 -c:v libx264 -preset veryfast -crf 21 \
            -c:a aac -b:a 160k \
            build/outro.mp4

      - name: Montar vídeo final e thumbnail
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf

          printf "file '%s/build/intro.mp4'\nfile '%s/build/music.mp4'\nfile '%s/build/outro.mp4'\n" \
            "$PWD" "$PWD" "$PWD" > build/concat.txt

          ffmpeg -y -v error \
            -f concat -safe 0 -i build/concat.txt \
            -c:v libx264 -preset veryfast -crf 22 \
            -maxrate 5500k -bufsize 9000k \
            -pix_fmt yuv420p -profile:v high -level 4.1 -g 60 \
            -c:a aac -b:a 192k -ar 48000 \
            -movflags +faststart \
            dist/os-atuais-meu-segredo.mp4

          ffmpeg -y -v error \
            -i build/cover.png \
            -vf "scale=600:600,rotate=-0.10:ow=rotw(iw):oh=roth(ih):c=black@0,scale=1280:720,drawtext=fontfile=${FONT}:text='MEU SEGREDO':fontcolor=white:fontsize=92:x=45:y=65,drawtext=fontfile=${FONT}:text='OS ATUAIS':fontcolor=0xFFC125:fontsize=55:x=45:y=180" \
            -frames:v 1 \
            dist/thumbnail.jpg

          cat > dist/descricao.txt <<'EOF'
          Os Atuais – Meu Segredo | Eu Voltei, Vol. 9

          00:00 Introdução
          00:18 Meu Segredo
          03:08 Encerramento

          Artista: Os Atuais
          Faixa: Meu Segredo
          Disco: Eu Voltei – Volume 9
          Selo visível na capa: América

          Fontes:
          https://osatuais.com.br/historico/
          https://pt.wikipedia.org/wiki/Os_Atuais
          https://www.rz.net.br/banda/os-atuais

          Comente qual lembrança essa música desperta em você.
          #OsAtuais #MeuSegredo #MusicaGaucha
          EOF

      - name: Validar entregáveis
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,codec_type,width,height,r_frame_rate \
            -of default=nw=1 \
            dist/os-atuais-meu-segredo.mp4

          test -s dist/thumbnail.jpg
          test -s dist/descricao.txt

      - name: Publicar entregáveis
        uses: actions/upload-artifact@v4
        with:
          name: os-atuais-meu-segredo-youtube-deliverables
          path: dist/
          if-no-files-found: error
          retention-days: 14